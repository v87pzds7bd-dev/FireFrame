name: Build FireFrame Preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-preview.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;35.0.0'
      - name: Verify Android SDK
        run: |
          test -f "$ANDROID_HOME/platforms/android-34/android.jar"
          test -f "$ANDROID_HOME/build-tools/35.0.0/core-lambda-stubs.jar"
          for tool in aapt2 d8 zipalign apksigner; do
            test -x "$ANDROID_HOME/build-tools/35.0.0/$tool"
          done
      - name: Build isolated local preview
        shell: bash
        run: |
          set -eu
          mkdir -p preview-build/src preview-build/res/xml preview-build/classes preview-build/dex
          cd preview-build
          cat > src/PreviewActivity.java <<'JAVA'
          package com.fireframe.preview7;
          
          import android.app.Activity;
          import android.accessibilityservice.AccessibilityService;
          import android.content.*;
          import android.content.pm.*;
          import android.graphics.*;
          import android.graphics.drawable.*;
          import android.os.*;
          import android.view.*;
          import android.view.accessibility.*;
          import android.widget.*;
          import java.util.*;
          
          public class PreviewActivity extends Activity {
              static final String AMAZON="com.amazon.tv.launcher";
              static final String[] LABELS={"YouTube","Netflix","Twitch","Prime Video","ARD Mediathek"};
              static final String[][] PACKAGES={
                  {"com.amazon.firetv.youtube","com.google.android.youtube.tv","com.amazon.firetv.youtube.tv"},
                  {"com.netflix.ninja"},{"tv.twitch.android.viewer","tv.twitch.android.app"},
                  {"com.amazon.firebat","com.amazon.amazonvideo.livingroom"},
                  {"de.swr.avp.ard","de.ard.mediathek","de.ard.mediathek.tv"}
              };
              static final int[] TILE={0xfff7f7f7,0xfff7f7f7,0xff6441a5,0xff146ac3,0xff1248ae};
              static final int[] GLOW={0xff53313a,0xff55232d,0xff473267,0xff1e4367,0xff253b69};
              FrameLayout root,shelf,menu;
              ShelfBackdrop backdrop;
              LinearLayout dockRow;
              TextView shelfTitle,focusLabel;
              View home,settings,amazon;
              View[] nav=new View[5];
              String[] packages=new String[5];
              int selected=-1;
              float scale=1;
          
              @Override public void onCreate(Bundle b){
                  super.onCreate(b);getWindow().setFlags(1024,1024);getWindow().getDecorView().setSystemUiVisibility(5894);
                  android.util.DisplayMetrics d=new android.util.DisplayMetrics();getWindowManager().getDefaultDisplay().getRealMetrics(d);
                  scale=Math.min(d.widthPixels/1920f,d.heightPixels/1080f);build();
              }
              @Override protected void onNewIntent(Intent i){
                  super.onNewIntent(i);setIntent(i);
                  if(i.getBooleanExtra("show_home",false)&&home!=null){closeMenu();home.requestFocus();renderShelf(-1);}
              }
              int px(float v){return Math.max(1,Math.round(v*scale));}
              FrameLayout.LayoutParams at(int x,int y,int w,int h){
                  FrameLayout.LayoutParams p=new FrameLayout.LayoutParams(w<0?w:px(w),h<0?h:px(h));p.leftMargin=px(x);p.topMargin=px(y);return p;
              }
              GradientDrawable round(int color,int radius){GradientDrawable g=new GradientDrawable();g.setColor(color);g.setCornerRadius(px(radius));return g;}
              GradientDrawable glass(int radius,boolean focus){
                  GradientDrawable g=new GradientDrawable(GradientDrawable.Orientation.TOP_BOTTOM,new int[]{focus?0x90ffffff:0x35ffffff,focus?0x50ffffff:0x16ffffff});
                  g.setCornerRadius(px(radius));g.setStroke(px(1),focus?0xc0ffffff:0x45ffffff);return g;
              }
              TextView text(String value,int size,int color,boolean medium){
                  TextView v=new TextView(this);v.setText(value);v.setTextColor(color);v.setTextSize(android.util.TypedValue.COMPLEX_UNIT_PX,px(size));
                  v.setTypeface(Typeface.create(medium?"sans-serif-medium":"sans-serif",Typeface.NORMAL));v.setGravity(Gravity.CENTER_VERTICAL);v.setIncludeFontPadding(false);return v;
              }
              void focusable(View v){v.setId(View.generateViewId());v.setFocusable(true);v.setFocusableInTouchMode(true);v.setClickable(true);}
              String findApp(int k){
                  PackageManager pm=getPackageManager();for(String p:PACKAGES[k])if(pm.getLeanbackLaunchIntentForPackage(p)!=null||pm.getLaunchIntentForPackage(p)!=null)return p;
                  for(String cat:new String[]{Intent.CATEGORY_LEANBACK_LAUNCHER,Intent.CATEGORY_LAUNCHER})for(ResolveInfo r:pm.queryIntentActivities(new Intent(Intent.ACTION_MAIN).addCategory(cat),0)){
                      String l=r.loadLabel(pm).toString().toLowerCase(Locale.ROOT);if(l.equals(LABELS[k].toLowerCase(Locale.ROOT))||(k==4&&l.contains("ard")&&l.contains("mediathek")))return r.activityInfo.packageName;
                  }return "";
              }
              Drawable banner(int app){
                  try{PackageManager pm=getPackageManager();String p=packages[app];Drawable d=pm.getApplicationBanner(p);if(d!=null)return d;Intent i=pm.getLeanbackLaunchIntentForPackage(p);if(i!=null&&i.getComponent()!=null)return pm.getActivityBanner(i.getComponent());}catch(Exception ignored){}return null;
              }
              View makeArt(int k,int radius){
                  FrameLayout v=new FrameLayout(this);v.setBackground(round(k<0?0xff24282e:TILE[k],radius));v.setClipToOutline(true);
                  if(k<0){IconView icon=new IconView(this,0);FrameLayout.LayoutParams p=new FrameLayout.LayoutParams(px(83),px(83),Gravity.CENTER);v.addView(icon,p);}
                  else{
                      Drawable d=banner(k);
                      if(d!=null){ImageView im=new ImageView(this);im.setImageDrawable(d);im.setScaleType(ImageView.ScaleType.CENTER_CROP);v.addView(im,new FrameLayout.LayoutParams(-1,-1));}
                      else {TextView t=text(LABELS[k],k==4?30:39,k==0?0xff171717:k==1?0xffd60015:Color.WHITE,true);t.setGravity(Gravity.CENTER);v.addView(t,new FrameLayout.LayoutParams(-1,-1));}
                  }
                  View shine=new View(this);shine.setBackground(new GradientDrawable(GradientDrawable.Orientation.TOP_BOTTOM,new int[]{0x18ffffff,0x00ffffff,0x0a000000}));v.addView(shine,new FrameLayout.LayoutParams(-1,-1));
                  return v;
              }
              void styleTile(View v,boolean f){
                  float z=f?1.105f:1f;v.animate().cancel();v.animate().scaleX(z).scaleY(z).setDuration(f?170:150).setInterpolator(new android.view.animation.DecelerateInterpolator()).start();
                  v.setTranslationZ(px(f?24:2));v.setElevation(px(f?19:3));
                  // No thick focus outline: enlargement, lift, subtle edge light.
                  GradientDrawable edge=round(0x00000000,18);edge.setStroke(px(f?2:1),f?0x9affffff:0x22ffffff);v.setForeground(edge);
              }
              void build(){
                  root=new FrameLayout(this);root.setClipChildren(false);root.setClipToPadding(false);root.setBackgroundColor(0xff17191e);setContentView(root);
                  for(int i=0;i<5;i++)packages[i]=findApp(i);
                  backdrop=new ShelfBackdrop(this);root.addView(backdrop,new FrameLayout.LayoutParams(-1,-1));
                  // Top Shelf: full-bleed background, no dashboard frame or call-to-action.
                  shelf=new FrameLayout(this);shelf.setClipChildren(false);root.addView(shelf,at(0,0,1920,694));
          
                  FrameLayout glassDock=new FrameLayout(this);glassDock.setClipChildren(false);glassDock.setClipToPadding(false);
                  glassDock.setBackground(glass(34,false));glassDock.setElevation(px(3));root.addView(glassDock,at(65,711,1790,208));
                  dockRow=new LinearLayout(this);dockRow.setGravity(Gravity.CENTER);dockRow.setClipChildren(false);dockRow.setClipToPadding(false);glassDock.addView(dockRow,at(0,0,1790,208));
                  home=makeTile(-1);
                  for(int i=0;i<5;i++)nav[i]=makeTile(i);
                  focusLabel=text("Home",29,0xfff5f6f8,true);focusLabel.setGravity(Gravity.CENTER);root.addView(focusLabel,at(75,933,1770,53));
          
                  // Two small controls beside the clock, separate from the main app row.
                  FrameLayout controls=new FrameLayout(this);controls.setBackground(glass(34,false));root.addView(controls,at(1510,44,350,77));
                  settings=topControl(1,"Einstellungen",12,8,62,v->showSettings(),controls);
                  amazon=topControl(2,"Fire TV Home",87,8,62,v->showAmazon(false),controls);
                  TextClock clock=new TextClock(this);clock.setFormat24Hour("HH:mm");clock.setFormat12Hour("h:mm");clock.setTextColor(0xfff2f2f5);clock.setTextSize(android.util.TypedValue.COMPLEX_UNIT_PX,px(30));clock.setGravity(Gravity.CENTER);controls.addView(clock,at(161,8,174,62));
                  home.setNextFocusRightId(nav[0].getId());
                  for(int i=0;i<5;i++){nav[i].setNextFocusLeftId(i==0?home.getId():nav[i-1].getId());if(i<4)nav[i].setNextFocusRightId(nav[i+1].getId());}
                  home.setNextFocusUpId(settings.getId());for(int i=0;i<5;i++)nav[i].setNextFocusUpId(i<3?settings.getId():amazon.getId());
                  settings.setNextFocusRightId(amazon.getId());amazon.setNextFocusLeftId(settings.getId());settings.setNextFocusDownId(home.getId());amazon.setNextFocusDownId(nav[4].getId());
                  home.requestFocus();renderShelf(-1);
              }
              View makeTile(int k){
                  FrameLayout tile=new FrameLayout(this);focusable(tile);tile.setContentDescription(k<0?"Home":LABELS[k]);
                  tile.setBackground(round(k<0?0xff24282e:TILE[k],18));tile.setClipToOutline(true);tile.addView(makeArt(k,18),new FrameLayout.LayoutParams(-1,-1));
                  LinearLayout.LayoutParams lp=new LinearLayout.LayoutParams(px(253),px(152));lp.leftMargin=px(15);lp.rightMargin=px(15);dockRow.addView(tile,lp);
                  styleTile(tile,false);
                  tile.setOnFocusChangeListener((v,f)->{styleTile(v,f);if(f)renderShelf(k);});
                  tile.setOnClickListener(v->{if(k<0){renderShelf(-1);}else openApp(k);});
                  return tile;
              }
              View topControl(int type,String name,int x,int y,int width,View.OnClickListener click,FrameLayout parent){
                  FrameLayout v=new FrameLayout(this);focusable(v);v.setContentDescription(name);v.setPadding(px(16),px(16),px(16),px(16));v.addView(new IconView(this,type),new FrameLayout.LayoutParams(-1,-1));v.setBackground(round(0x00000000,30));
                  v.setOnFocusChangeListener((w,f)->{w.setBackground(f?glass(30,true):round(0x00000000,30));if(f)focusLabel.setText(name);});v.setOnClickListener(click);parent.addView(v,at(x,y,width,62));return v;
              }
              void renderShelf(int k){
                  if(shelf==null)return;selected=k;backdrop.change(k);shelf.removeAllViews();
                  if(k<0){
                      // Neutral artwork is a local fallback until real continue-watching data is available.
                      // No synthetic viewing history or promotional content.
                  }else{
                      // Static Top Shelf art fallback: only the selected app's actual installed banner.
                      // Replace this single content layer with 3 real resume cards when integration exists.
                      FrameLayout logo=new FrameLayout(this);logo.setClipToOutline(true);logo.setBackground(round(TILE[k],36));
                      View art=makeArt(k,36);logo.addView(art,new FrameLayout.LayoutParams(-1,-1));
                      logo.setElevation(px(14));shelf.addView(logo,at(635,168,650,390));
                      logo.setAlpha(0f);logo.animate().alpha(1f).setDuration(180).start();
                  }
                  focusLabel.setText(k<0?"Home":LABELS[k]);
              }
              // Lightweight, locally drawn wallpaper and tint. No image download or extra permissions.
              static final class ShelfBackdrop extends View{
                  final Paint paint=new Paint(Paint.ANTI_ALIAS_FLAG);int mode=-1;
                  ShelfBackdrop(Context c){super(c);}
                  void change(int n){mode=n;invalidate();}
                  @Override protected void onDraw(Canvas canvas){
                      super.onDraw(canvas);float w=getWidth(),h=getHeight();if(w<=0||h<=0)return;
                      paint.setShader(new LinearGradient(0,0,w*.67f,h,new int[]{0xff454952,0xff292b34,0xff17191e},null,Shader.TileMode.CLAMP));canvas.drawRect(0,0,w,h,paint);
                      if(mode<0){
                          paint.setShader(new RadialGradient(w*.73f,h*.13f,w*.70f,new int[]{0xff777585,0xff444951,0x00444951},new float[]{0,.46f,1},Shader.TileMode.CLAMP));canvas.drawRect(0,0,w,h,paint);
                          Path p=new Path();p.moveTo(-w*.08f,h*.50f);p.cubicTo(w*.26f,h*.11f,w*.59f,h*.77f,w*1.05f,h*.12f);p.lineTo(w*1.05f,h);p.lineTo(-w*.08f,h);p.close();
                          paint.setShader(new LinearGradient(0,h*.19f,w*.86f,h*.80f,new int[]{0xff343b49,0xff73717f,0xff272a34},null,Shader.TileMode.CLAMP));canvas.drawPath(p,paint);
                          Path q=new Path();q.moveTo(-w*.05f,h*.70f);q.cubicTo(w*.28f,h*.28f,w*.59f,h*.86f,w*1.05f,h*.33f);q.lineTo(w*1.05f,h);q.lineTo(-w*.05f,h);q.close();
                          paint.setShader(new LinearGradient(0,h*.35f,w,h,new int[]{0xff4a4b58,0xff292c36,0xff1d2026},null,Shader.TileMode.CLAMP));canvas.drawPath(q,paint);
                      }else{
                          int tint=GLOW[mode];paint.setShader(new RadialGradient(w*.5f,h*.32f,w*.57f,new int[]{tint,0xff282b33,0xff17191e},new float[]{0,.55f,1},Shader.TileMode.CLAMP));canvas.drawRect(0,0,w,h,paint);
                      }
                      paint.setShader(new LinearGradient(0,h*.52f,0,h,new int[]{0x0017191e,0xd917191e,0xff17191e},new float[]{0,.73f,1},Shader.TileMode.CLAMP));canvas.drawRect(0,h*.52f,w,h,paint);paint.setShader(null);
                  }
              }
              static final class IconView extends View{
                  final int type;IconView(Context c,int type){super(c);this.type=type;}
                  @Override protected void onDraw(Canvas c){
                      super.onDraw(c);float w=getWidth(),h=getHeight();c.save();c.scale(w/100f,h/100f);Paint p=new Paint(3);p.setColor(Color.WHITE);p.setStyle(Paint.Style.STROKE);p.setStrokeWidth(6);p.setStrokeJoin(Paint.Join.ROUND);p.setStrokeCap(Paint.Cap.ROUND);
                      if(type==0){Path q=new Path();q.moveTo(9,47);q.lineTo(50,11);q.lineTo(91,47);q.moveTo(20,37);q.lineTo(20,86);q.lineTo(42,86);q.lineTo(42,61);q.lineTo(58,61);q.lineTo(58,86);q.lineTo(80,86);q.lineTo(80,37);c.drawPath(q,p);}
                      else if(type==1){Path q=new Path();for(int i=0;i<32;i++){double a=i*Math.PI/16;float r=(i%4==0||i%4==3)?42:33;float x=50+(float)Math.cos(a)*r,y=50+(float)Math.sin(a)*r;if(i==0)q.moveTo(x,y);else q.lineTo(x,y);}q.close();c.drawPath(q,p);c.drawCircle(50,50,15,p);}
                      else{c.drawRoundRect(8,15,92,75,9,9,p);c.drawLine(30,88,70,88,p);c.drawLine(50,75,50,88,p);c.drawLine(42,33,63,45,p);c.drawLine(63,45,42,57,p);c.drawLine(42,57,42,33,p);}
                      c.restore();
                  }
              }
              void openApp(int k){
                  try{Intent i=getPackageManager().getLeanbackLaunchIntentForPackage(packages[k]);if(i==null)i=getPackageManager().getLaunchIntentForPackage(packages[k]);if(i==null)throw new Exception();startActivity(i);}
                  catch(Exception e){Toast.makeText(this,LABELS[k]+" nicht gefunden",Toast.LENGTH_SHORT).show();}
              }
              void showSettings(){
                  if(menu!=null)return;
                  menu=new FrameLayout(this);menu.setBackgroundColor(0x99000000);root.addView(menu,new FrameLayout.LayoutParams(-1,-1));
                  FrameLayout panel=new FrameLayout(this);panel.setBackground(round(0xff32353d,40));panel.setElevation(px(25));menu.addView(panel,at(1150,140,710,560));
                  TextView title=text("Einstellungen",40,Color.WHITE,true);panel.addView(title,at(42,36,626,64));
                  String[] labels={"Fire TV Systemeinstellungen","Originale Fire TV Startseite","Weiterschauen · pausiert","Schließen"};
                  View prev=null;
                  for(int i=0;i<labels.length;i++){
                      final int n=i;TextView item=text(labels[i],29,Color.WHITE,false);focusable(item);item.setPadding(px(22),0,px(20),0);item.setBackground(round(0xff444750,17));
                      item.setOnFocusChangeListener((v,f)->{v.setBackground(round(f?0xffe6e8ec:0xff444750,17));((TextView)v).setTextColor(f?0xff20222a:Color.WHITE);});
                      item.setOnClickListener(v->{closeMenu();if(n==0||n==1)showAmazon(n==0);else if(n==2)Toast.makeText(this,"Weiterschauen wird später unabhängig von Amazon entwickelt.",Toast.LENGTH_LONG).show();});
                      panel.addView(item,at(42,126+i*98,626,78));if(prev==null)item.requestFocus();else{prev.setNextFocusDownId(item.getId());item.setNextFocusUpId(prev.getId());}prev=item;
                      item.setNextFocusLeftId(item.getId());item.setNextFocusRightId(item.getId());
                      if(i==0)item.setNextFocusUpId(item.getId());if(i==labels.length-1)item.setNextFocusDownId(item.getId());
                  }
              }
              void closeMenu(){if(menu!=null){root.removeView(menu);menu=null;if(settings!=null)settings.requestFocus();}}
              @Override public void onBackPressed(){if(menu!=null)closeMenu();else if(home!=null){home.requestFocus();renderShelf(-1);}else super.onBackPressed();}
              void showAmazon(boolean settings){
                  if(ContinueService.running!=null)ContinueService.running.pauseForAmazon();
                  try{Intent i=new Intent(Intent.ACTION_MAIN).addCategory(settings?"android.intent.category.LEANBACK_SETTINGS":Intent.CATEGORY_HOME).setPackage(AMAZON).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);startActivity(i);}
                  catch(Exception e){if(settings){try{startActivity(new Intent(android.provider.Settings.ACTION_SETTINGS));}catch(Exception ignored){}}else Toast.makeText(this,"Fire TV Startseite nicht verfügbar",Toast.LENGTH_LONG).show();}
              }
              // Home routing only. No screen scraping, capture, or viewing-history requests.
              public static class ContinueService extends AccessibilityService{
                  static ContinueService running;
                  final Handler h=new Handler(Looper.getMainLooper());final Runnable launch=this::showPreview;
                  boolean registered,manualAmazon;long ignoreUntil,suppressUntil;
                  static final class HomeReceiver extends BroadcastReceiver{
                      final ContinueService service;HomeReceiver(ContinueService s){service=s;}
                      @Override public void onReceive(Context c,Intent i){long now=SystemClock.elapsedRealtime();if(now<service.ignoreUntil)return;service.manualAmazon=false;service.suppressUntil=0;service.h.removeCallbacks(service.launch);service.h.postDelayed(service.launch,450);}
                  }
                  final HomeReceiver receiver=new HomeReceiver(this);
                  @Override protected void onServiceConnected(){super.onServiceConnected();running=this;try{registerReceiver(receiver,new IntentFilter("com.amazon.tv.launcher.HOME_PRESSED"));registered=true;}catch(Exception ignored){}}
                  void pauseForAmazon(){manualAmazon=true;ignoreUntil=SystemClock.elapsedRealtime()+1800;h.removeCallbacks(launch);}
                  @Override public void onAccessibilityEvent(AccessibilityEvent e){
                      if(e.getPackageName()==null||!AMAZON.contentEquals(e.getPackageName())||e.getEventType()!=AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED||manualAmazon||SystemClock.elapsedRealtime()<suppressUntil)return;
                      String cls=String.valueOf(e.getClassName());if(!cls.contains("HomeActivity"))return;h.removeCallbacks(launch);h.postDelayed(launch,550);
                  }
                  void showPreview(){if(manualAmazon)return;suppressUntil=SystemClock.elapsedRealtime()+5000;try{startActivity(new Intent(this,PreviewActivity.class).putExtra("show_home",true).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK|Intent.FLAG_ACTIVITY_SINGLE_TOP));}catch(Exception ignored){}}
                  @Override public void onInterrupt(){h.removeCallbacks(launch);}
                  @Override public void onDestroy(){onInterrupt();if(registered)try{unregisterReceiver(receiver);}catch(Exception ignored){}if(running==this)running=null;super.onDestroy();}
              }
          }
          JAVA
          cat > AndroidManifest.xml <<'MANIFEST'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.fireframe.preview7" android:versionCode="7" android:versionName="0.7">
           <uses-sdk android:minSdkVersion="22" android:targetSdkVersion="28" />
           <uses-feature android:name="android.software.leanback" android:required="false" />
           <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
           <application android:label="FireFrame Preview 0.7" android:allowBackup="false" android:theme="@android:style/Theme.Black.NoTitleBar.Fullscreen">
            <activity android:name=".PreviewActivity" android:exported="true" android:launchMode="singleTask" android:screenOrientation="landscape">
             <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LEANBACK_LAUNCHER"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
            </activity>
            <service android:name=".PreviewActivity$ContinueService" android:exported="true" android:label="FireFrame Preview – Home-Taste" android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
             <intent-filter><action android:name="android.accessibilityservice.AccessibilityService"/></intent-filter>
             <meta-data android:name="android.accessibilityservice" android:resource="@xml/continue_service"/>
            </service>
           </application>
          </manifest>
          MANIFEST
          cat > res/xml/continue_service.xml <<'XML'
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android" android:packageNames="com.amazon.tv.launcher" android:accessibilityEventTypes="typeWindowStateChanged" android:accessibilityFeedbackType="feedbackGeneric" android:canRetrieveWindowContent="false" android:notificationTimeout="100"  />
          XML
          BT="$ANDROID_HOME/build-tools/35.0.0"
          JAR="$ANDROID_HOME/platforms/android-34/android.jar"
          "$BT/aapt2" compile --dir res -o res.zip
          "$BT/aapt2" link -o base.apk -I "$JAR" --manifest AndroidManifest.xml --min-sdk-version 22 --target-sdk-version 28 res.zip
          javac -encoding UTF-8 -source 1.8 -target 1.8 -bootclasspath "$JAR:$BT/core-lambda-stubs.jar" -d classes src/PreviewActivity.java
          "$BT/d8" --min-api 22 --release --lib "$JAR" --output dex $(find classes -name '*.class')
          cp base.apk unsigned.apk
          (cd dex && zip -q ../unsigned.apk classes.dex)
          "$BT/zipalign" -f 4 unsigned.apk aligned.apk
          keytool -genkeypair -keystore preview.jks -storepass preview-test -keypass preview-test -alias preview -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=FireFrame Preview Test"
          "$BT/apksigner" sign --ks preview.jks --ks-pass pass:preview-test --out FireFrame-Preview-07.apk aligned.apk
          "$BT/apksigner" verify FireFrame-Preview-07.apk
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: FireFrame-Preview-07
          path: preview-build/FireFrame-Preview-07.apk
          if-no-files-found: error
