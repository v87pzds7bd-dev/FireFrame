                  }
                  void cover(){
                      if(manualAmazon)return;
                      suppressUntil=SystemClock.elapsedRealtime()+6500;
                      show();
                      try{startActivity(new Intent(this,PreviewActivity.class).putExtra("show_home",true).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK|Intent.FLAG_ACTIVITY_SINGLE_TOP|Intent.FLAG_ACTIVITY_NO_ANIMATION));}
                      catch(Exception e){hide();}
                  }
                  void queue(int action){
                      if(!showing)return;pendingAction=action;
                      if(overlay!=null)overlay.focusLabel.setText(action>=0&&action<5?Screen.LABELS[action]+" wird geöffnet …":action==5?"Einstellungen werden geöffnet …":"Fire TV Home wird geöffnet …");
                  }
                  void appDrawn(Screen screen){
                      if(!showing)return;
                      int slot=overlay.focusSlot(),action=pendingAction;
                      // The underlying Activity is now drawn. Transfer the selected tile and
                      // any click from the overlay, then release its input/window immediately.
                      hide();
                      screen.root.postDelayed(()->{if(screen.active){screen.focusSlot(slot);if(action>=0)screen.runAction(action);}},100);
                  }
                  @Override public void onInterrupt(){hide();}
                  void cleanup(){
                      hide();if(registered){try{unregisterReceiver(receiver);}catch(Exception ignored){}registered=false;}
                      if(added&&wm!=null&&overlay!=null){try{wm.removeViewImmediate(overlay.root);}catch(RuntimeException ignored){}added=false;}
                      if(running==this)running=null;
                  }
                  @Override public boolean onUnbind(Intent i){cleanup();return super.onUnbind(i);}
                  @Override public void onDestroy(){cleanup();super.onDestroy();}
              }
          }
          JAVA
          cat > AndroidManifest.xml <<'MANIFEST'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.fireframe.preview12" android:versionCode="12" android:versionName="1.2">
           <uses-sdk android:minSdkVersion="22" android:targetSdkVersion="28" />
           <uses-permission android:name="android.permission.INTERNET" />
           <uses-feature android:name="android.software.leanback" android:required="false" />
           <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
           <application android:label="FireFrame Preview 1.2" android:allowBackup="false" android:theme="@android:style/Theme.Black.NoTitleBar.Fullscreen">
            <activity android:name=".PreviewActivity" android:exported="true" android:launchMode="singleTask" android:screenOrientation="landscape">
             <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LEANBACK_LAUNCHER"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
            </activity>
            <service android:name=".PreviewActivity$ContinueService" android:exported="true" android:label="FireFrame Preview – Home-Taste" android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
             <intent-filter><action android:name="android.accessibilityservice.AccessibilityService"/></intent-filter>
             <meta-data android:name="android.accessibilityservice" android:resource="@xml/continue_service"/>
            </service>
           </application>
          </manifest>
          MANIFEST
          cat > res/xml/continue_service.xml <<'XML'
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android" android:packageNames="com.amazon.tv.launcher" android:accessibilityEventTypes="typeWindowStateChanged" android:accessibilityFeedbackType="feedbackGeneric" android:canRetrieveWindowContent="false" android:notificationTimeout="100"  />
