              static final class AppEntry {
                  final String pkg,name;final Intent intent;final ResolveInfo info;final long recent,installed;
                  AppEntry(String p,String n,Intent i,ResolveInfo r,long rec,long ins){pkg=p;name=n;intent=i;info=r;recent=rec;installed=ins;}
              }
              List<AppEntry> installedApps(){
                  PackageManager pm=getPackageManager();Map<String,AppEntry> apps=new LinkedHashMap<>();
                  for(String cat:new String[]{Intent.CATEGORY_LEANBACK_LAUNCHER,Intent.CATEGORY_LAUNCHER}){
                      for(ResolveInfo r:pm.queryIntentActivities(new Intent(Intent.ACTION_MAIN).addCategory(cat),0)){
                          if(r.activityInfo==null||!r.activityInfo.enabled||!r.activityInfo.exported)continue;
                          String pkg=r.activityInfo.packageName;
                          if(pkg.startsWith("com.fireframe.preview")||pkg.equals(AMAZON)||apps.containsKey(pkg))continue;
                          Intent launch=pm.getLeanbackLaunchIntentForPackage(pkg);if(launch==null)launch=pm.getLaunchIntentForPackage(pkg);if(launch==null)continue;
                          long installed=0;try{installed=pm.getPackageInfo(pkg,0).firstInstallTime;}catch(Exception ignored){}
                          String name=r.loadLabel(pm).toString();
                          apps.put(pkg,new AppEntry(pkg,name,launch,r,info.getLong("recent_"+pkg,0),installed));
                      }
                  }
                  List<AppEntry> list=new ArrayList<>(apps.values());
                  Collections.sort(list,(a,b)->{int c=Long.compare(b.recent,a.recent);if(c!=0)return c;c=Long.compare(b.installed,a.installed);return c!=0?c:a.pkg.compareTo(b.pkg);});return list;
              }
