name: Build FireFrame Preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-preview.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;35.0.0'
      - name: Verify Android SDK
        run: |
          test -f "$ANDROID_HOME/platforms/android-34/android.jar"
          test -f "$ANDROID_HOME/build-tools/35.0.0/core-lambda-stubs.jar"
          for tool in aapt2 d8 zipalign apksigner; do
            test -x "$ANDROID_HOME/build-tools/35.0.0/$tool"
          done
      - name: Build isolated local preview
        shell: bash
        run: |
          set -eu
          mkdir -p preview-build/src preview-build/res/xml preview-build/classes preview-build/dex
          cd preview-build
          cat > src/PreviewActivity.java <<'JAVA'
          package com.fireframe.preview6;
          
          import android.app.Activity;
          import android.accessibilityservice.AccessibilityService;
          import android.content.*;
          import android.content.pm.*;
          import android.graphics.*;
          import android.graphics.drawable.*;
          import android.os.*;
          import android.view.*;
          import android.view.accessibility.*;
          import android.widget.*;
          import org.json.*;
          import java.util.*;
          
          public class PreviewActivity extends Activity {
              static final String AMAZON="com.amazon.tv.launcher";
              static final String[] LABELS={"YouTube","Netflix","Twitch","Prime Video","ARD Mediathek"};
              static final String[][] PACKAGES={
                  {"com.amazon.firetv.youtube","com.google.android.youtube.tv","com.amazon.firetv.youtube.tv"},
                  {"com.netflix.ninja"},{"tv.twitch.android.viewer","tv.twitch.android.app"},
                  {"com.amazon.firebat","com.amazon.amazonvideo.livingroom"},
                  {"de.swr.avp.ard","de.ard.mediathek","de.ard.mediathek.tv"}
              };
              static final int[] ACCENT={0xffbd2830,0xff9d1123,0xff673aab,0xff176ab0,0xff204da4};
              static final int[] TILE={0xffeeeeef,0xffeeeeef,0xff6441a5,0xff135b91,0xff174a92};
              static SharedPreferences prefs(Context c){return c.getSharedPreferences("launcher_ui",Context.MODE_PRIVATE);}
              FrameLayout root,hero,heroArt; LinearLayout quick;
              TextView eyebrow,headline,description,section,subsection,cta;
              View home,settings,amazon; View[] nav=new View[5]; String[] packages=new String[5];
              int selected=-1,heroApp=0; float scale=1;
              @Override public void onCreate(Bundle b){
                  super.onCreate(b);getWindow().setFlags(1024,1024);getWindow().getDecorView().setSystemUiVisibility(5894);
                  android.util.DisplayMetrics d=new android.util.DisplayMetrics();getWindowManager().getDefaultDisplay().getRealMetrics(d);
                  scale=Math.min(d.widthPixels/1920f,d.heightPixels/1080f);build();
              }
              @Override protected void onNewIntent(Intent i){super.onNewIntent(i);setIntent(i);if(i.getBooleanExtra("show_home",false)){home.requestFocus();render(-1);}}
              @Override protected void onResume(){super.onResume();if(root!=null)render(selected);}
              int px(float x){return Math.max(1,Math.round(x*scale));}
              FrameLayout.LayoutParams at(int x,int y,int w,int h){FrameLayout.LayoutParams p=new FrameLayout.LayoutParams(px(w),px(h));p.leftMargin=px(x);p.topMargin=px(y);return p;}
              GradientDrawable round(int color,int radius){GradientDrawable g=new GradientDrawable();g.setColor(color);g.setCornerRadius(px(radius));return g;}
              GradientDrawable gradient(int start,int end,int radius){GradientDrawable g=new GradientDrawable(GradientDrawable.Orientation.TL_BR,new int[]{start,end});g.setCornerRadius(px(radius));return g;}
              TextView label(String s,int size,int color,boolean bold){
                  TextView t=new TextView(this);t.setText(s);t.setTextColor(color);t.setTextSize(android.util.TypedValue.COMPLEX_UNIT_PX,px(size));t.setTypeface(Typeface.create(bold?"sans-serif-medium":"sans-serif",Typeface.NORMAL));t.setIncludeFontPadding(false);t.setGravity(Gravity.CENTER_VERTICAL);return t;
              }
              void focusable(View v){v.setId(View.generateViewId());v.setFocusable(true);v.setFocusableInTouchMode(true);v.setClickable(true);}
              void focusStyle(View v,boolean focused,int base,int radius,boolean enlarge){
                  GradientDrawable g=round(focused?0xff374452:base,radius);
                  if(focused)g.setStroke(px(3),0xfff5f7fa);
                  v.setBackground(g);v.setElevation(px(focused?12:1));
                  float z=focused&&enlarge?1.045f:1f;
                  v.animate().scaleX(z).scaleY(z).setDuration(140).start();
              }
              String findApp(int k){
                  PackageManager pm=getPackageManager();for(String p:PACKAGES[k])if(pm.getLeanbackLaunchIntentForPackage(p)!=null||pm.getLaunchIntentForPackage(p)!=null)return p;
                  for(String cat:new String[]{Intent.CATEGORY_LEANBACK_LAUNCHER,Intent.CATEGORY_LAUNCHER})for(ResolveInfo r:pm.queryIntentActivities(new Intent(Intent.ACTION_MAIN).addCategory(cat),0)){
                      String l=r.loadLabel(pm).toString().toLowerCase(Locale.ROOT);
                      if(l.equals(LABELS[k].toLowerCase(Locale.ROOT))||(k==4&&l.contains("ard")&&l.contains("mediathek")))return r.activityInfo.packageName;
                  }return "";
              }
              Drawable banner(String p){try{PackageManager pm=getPackageManager();Drawable d=pm.getApplicationBanner(p);if(d!=null)return d;Intent i=pm.getLeanbackLaunchIntentForPackage(p);if(i!=null&&i.getComponent()!=null)return pm.getActivityBanner(i.getComponent());}catch(Exception ignored){}return null;}
              View art(int app,int radius){
                  FrameLayout box=new FrameLayout(this);box.setBackground(round(TILE[app],radius));box.setClipToOutline(true);
                  Drawable d=banner(packages[app]);if(d!=null){ImageView im=new ImageView(this);im.setImageDrawable(d);im.setScaleType(ImageView.ScaleType.FIT_CENTER);box.addView(im,new FrameLayout.LayoutParams(-1,-1));}
                  else{TextView t=label(LABELS[app],34,app<2?0xff171717:Color.WHITE,true);t.setGravity(Gravity.CENTER);box.addView(t,new FrameLayout.LayoutParams(-1,-1));}
                  return box;
              }
              void build(){
                  root=new FrameLayout(this);root.setClipChildren(false);root.setBackground(gradient(0xff17212d,0xff0b1017,0));setContentView(root);
                  for(int i=0;i<5;i++)packages[i]=findApp(i);
                  LinearLayout bar=new LinearLayout(this);bar.setGravity(Gravity.CENTER_VERTICAL);bar.setClipChildren(false);root.addView(bar,at(70,36,1420,112));
                  LinearLayout h=new LinearLayout(this);h.setGravity(Gravity.CENTER);h.setOrientation(LinearLayout.HORIZONTAL);focusable(h);h.setContentDescription("Home");
                  IconView house=new IconView(this,0);h.addView(house,new LinearLayout.LayoutParams(px(36),px(36)));TextView ht=label("Home",30,Color.WHITE,true);LinearLayout.LayoutParams hl=new LinearLayout.LayoutParams(-2,-2);hl.leftMargin=px(12);h.addView(ht,hl);
                  LinearLayout.LayoutParams hp=new LinearLayout.LayoutParams(px(174),px(92));hp.rightMargin=px(17);bar.addView(h,hp);home=h;
                  focusStyle(home,false,0xff27323e,18,false);home.setOnFocusChangeListener((v,f)->{focusStyle(v,f,0xff27323e,18,false);if(f)render(-1);});home.setOnClickListener(v->render(-1));
                  for(int i=0;i<5;i++){
                      final int k=i;FrameLayout tile=new FrameLayout(this);focusable(tile);tile.setContentDescription(LABELS[i]);
                      tile.setPadding(px(5),px(5),px(5),px(5));tile.addView(art(i,12),new FrameLayout.LayoutParams(-1,-1));
                      LinearLayout.LayoutParams lp=new LinearLayout.LayoutParams(px(190),px(104));lp.rightMargin=px(14);bar.addView(tile,lp);nav[i]=tile;
                      focusStyle(tile,false,0xff242e38,16,true);tile.setOnFocusChangeListener((v,f)->{focusStyle(v,f,0xff242e38,16,true);if(f)render(k);});tile.setOnClickListener(v->openApp(k));
                  }
                  settings=topControl(1,"Einstellungen",1512,49,64,v->showSettings());
                  amazon=topControl(2,"Fire TV Home",1592,49,64,v->showAmazon(false));
                  TextClock clock=new TextClock(this);clock.setFormat24Hour("HH:mm");clock.setFormat12Hour("h:mm");clock.setTextColor(0xffc8d0da);clock.setTextSize(android.util.TypedValue.COMPLEX_UNIT_PX,px(34));clock.setGravity(Gravity.RIGHT|Gravity.CENTER_VERTICAL);root.addView(clock,at(1685,49,165,64));
                  View line=new View(this);line.setBackgroundColor(0xff2c3947);root.addView(line,at(70,164,1780,2));
                  hero=new FrameLayout(this);hero.setClipChildren(false);root.addView(hero,at(70,195,1780,520));
                  eyebrow=label("",26,0xffb4c9dd,true);hero.addView(eyebrow,at(52,46,900,48));
                  headline=label("",86,Color.WHITE,true);headline.setMaxLines(1);hero.addView(headline,at(52,104,1030,115));
                  description=label("",34,0xffc5d0dc,false);description.setMaxLines(2);hero.addView(description,at(56,236,930,100));
                  cta=label("Öffnen",32,0xff101721,true);cta.setGravity(Gravity.CENTER);focusable(cta);cta.setBackground(round(0xffe3eaf1,18));cta.setOnFocusChangeListener((v,f)->{GradientDrawable g=round(f?Color.WHITE:0xffe3eaf1,18);if(f)g.setStroke(px(4),0xff79b5ef);v.setBackground(g);v.animate().scaleX(f?1.035f:1).scaleY(f?1.035f:1).setDuration(130).start();});cta.setOnClickListener(v->openApp(heroApp));hero.addView(cta,at(56,366,290,76));
                  heroArt=new FrameLayout(this);heroArt.setBackground(round(0xff1c2734,26));heroArt.setPadding(px(20),px(20),px(20),px(20));hero.addView(heroArt,at(1100,64,600,370));
                  section=label("",38,Color.WHITE,true);root.addView(section,at(70,743,1780,50));
                  subsection=label("",27,0xffaab9c9,false);root.addView(subsection,at(70,800,1780,60));
                  quick=new LinearLayout(this);quick.setClipChildren(false);quick.setGravity(Gravity.CENTER_VERTICAL);root.addView(quick,at(70,815,1780,188));
                  home.setNextFocusRightId(nav[0].getId());home.setNextFocusDownId(cta.getId());
                  for(int i=0;i<5;i++){nav[i].setNextFocusLeftId(i==0?home.getId():nav[i-1].getId());nav[i].setNextFocusRightId(i==4?settings.getId():nav[i+1].getId());nav[i].setNextFocusDownId(cta.getId());}
                  settings.setNextFocusLeftId(nav[4].getId());settings.setNextFocusRightId(amazon.getId());settings.setNextFocusDownId(cta.getId());amazon.setNextFocusLeftId(settings.getId());amazon.setNextFocusDownId(cta.getId());
                  home.requestFocus();render(-1);
              }
              View topControl(int type,String name,int x,int y,int width,View.OnClickListener click){
                  FrameLayout v=new FrameLayout(this);focusable(v);v.setContentDescription(name);v.setPadding(px(14),px(14),px(14),px(14));v.addView(new IconView(this,type),new FrameLayout.LayoutParams(-1,-1));focusStyle(v,false,0xff263341,20,false);
                  v.setOnFocusChangeListener((w,f)->focusStyle(w,f,0xff263341,20,false));v.setOnClickListener(click);root.addView(v,at(x,y,width,64));return v;
              }
              static final class IconView extends View{
                  final int type;IconView(Context c,int type){super(c);this.type=type;}
                  @Override protected void onDraw(Canvas c){
                      super.onDraw(c);float w=getWidth(),h=getHeight();c.save();c.scale(w/100f,h/100f);Paint p=new Paint(3);p.setColor(Color.WHITE);p.setStyle(Paint.Style.STROKE);p.setStrokeWidth(6);p.setStrokeJoin(Paint.Join.ROUND);p.setStrokeCap(Paint.Cap.ROUND);
                      if(type==0){Path q=new Path();q.moveTo(8,46);q.lineTo(50,10);q.lineTo(92,46);q.moveTo(19,37);q.lineTo(19,88);q.lineTo(42,88);q.lineTo(42,61);q.lineTo(58,61);q.lineTo(58,88);q.lineTo(81,88);q.lineTo(81,37);c.drawPath(q,p);}
                      else if(type==1){Path q=new Path();for(int i=0;i<32;i++){double a=i*Math.PI/16;float r=(i%4==0||i%4==3)?42:33;float x=50+(float)Math.cos(a)*r,y=50+(float)Math.sin(a)*r;if(i==0)q.moveTo(x,y);else q.lineTo(x,y);}q.close();c.drawPath(q,p);c.drawCircle(50,50,15,p);}
                      else {c.drawRoundRect(8,15,92,75,9,9,p);c.drawLine(30,88,70,88,p);c.drawLine(50,75,50,88,p);c.drawLine(42,33,63,45,p);c.drawLine(63,45,42,57,p);c.drawLine(42,57,42,33,p);}
                      c.restore();
                  }
              }
              List<Integer> recents(){
                  List<Integer> list=new ArrayList<>();
                  try{JSONArray a=new JSONArray(prefs(this).getString("recent_apps","[]"));for(int i=0;i<a.length();i++){int k=a.optInt(i,-1);if(k>=0&&k<5&&!list.contains(k))list.add(k);}}catch(Exception ignored){}
                  return list;
              }
              void remember(int k){
                  List<Integer> l=recents();l.remove(Integer.valueOf(k));l.add(0,k);JSONArray a=new JSONArray();for(int n:l)a.put(n);prefs(this).edit().putString("recent_apps",a.toString()).apply();
              }
              void render(int k){
                  if(hero==null)return;selected=k;List<Integer> recent=recents();heroApp=k<0?(recent.isEmpty()?0:recent.get(0)):k;
                  int accent=ACCENT[heroApp];hero.setBackground(gradient(0xff202e3d,accent,30));
                  eyebrow.setText(k<0?(recent.isEmpty()?"HOME  /  SCHNELLSTART":"HOME  /  ZULETZT GEÖFFNET"):"APP");
                  headline.setText(LABELS[heroApp]);description.setText(k<0?"Starte deine App direkt von der Startseite.":heroApp==1||heroApp==3?"Streaming-App öffnen":"Öffne die App und entdecke deine Inhalte.");
                  cta.setText(LABELS[heroApp]+" öffnen");heroArt.removeAllViews();heroArt.addView(art(heroApp,18),new FrameLayout.LayoutParams(-1,-1));
                  cta.setNextFocusUpId(k<0?home.getId():nav[k].getId());cta.setNextFocusDownId(View.NO_ID);
                  quick.removeAllViews();subsection.setText("");section.setText("");
                  if(k==1||k==3){
                      section.setText("Weiterschauen");
                      subsection.setText("Diese Funktion wird unabhängig von der Amazon-Startseite entwickelt.");
                      return;
                  }
                  section.setText(k<0?(recent.isEmpty()?"Deine Apps":"Zuletzt geöffnet"):"Weitere Apps");
                  List<Integer> order=new ArrayList<>(recent);for(int i=0;i<5;i++)if(!order.contains(i))order.add(i);
                  if(k>=0)order.remove(Integer.valueOf(k));
                  View prev=null;
                  for(int app:order){
                      final int n=app;FrameLayout v=new FrameLayout(this);focusable(v);v.setContentDescription(LABELS[n]);v.setPadding(px(5),px(5),px(5),px(5));v.addView(art(n,13),new FrameLayout.LayoutParams(-1,-1));focusStyle(v,false,0xff202a35,18,true);
                      v.setOnFocusChangeListener((x,f)->focusStyle(x,f,0xff202a35,18,true));v.setOnClickListener(x->openApp(n));
                      LinearLayout.LayoutParams lp=new LinearLayout.LayoutParams(px(300),px(169));lp.rightMargin=px(22);quick.addView(v,lp);v.setNextFocusUpId(cta.getId());
                      if(prev==null)cta.setNextFocusDownId(v.getId());else{prev.setNextFocusRightId(v.getId());v.setNextFocusLeftId(prev.getId());}prev=v;
                  }
              }
              void openApp(int k){
                  try{Intent i=getPackageManager().getLeanbackLaunchIntentForPackage(packages[k]);if(i==null)i=getPackageManager().getLaunchIntentForPackage(packages[k]);if(i==null)throw new Exception();remember(k);startActivity(i);}
                  catch(Exception e){Toast.makeText(this,LABELS[k]+" nicht gefunden",Toast.LENGTH_SHORT).show();}
              }
              void showSettings(){
                  new android.app.AlertDialog.Builder(this).setTitle("Einstellungen").setItems(new String[]{"Weiterschauen: pausiert","Fire TV Systemeinstellungen","Originale Fire TV Startseite"},(d,n)->{if(n==0)Toast.makeText(this,"Weiterschauen wird später ohne Amazon-Scan neu entwickelt.",Toast.LENGTH_LONG).show();else showAmazon(n==1);}).setNegativeButton("Schließen",null).show();
              }
              void showAmazon(boolean settings){
                  if(ContinueService.running!=null)ContinueService.running.pauseForAmazon();
                  try{Intent i=new Intent(Intent.ACTION_MAIN).addCategory(settings?"android.intent.category.LEANBACK_SETTINGS":Intent.CATEGORY_HOME).setPackage(AMAZON).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);startActivity(i);}
                  catch(Exception e){if(settings){try{startActivity(new Intent(android.provider.Settings.ACTION_SETTINGS));}catch(Exception ignored){}}else Toast.makeText(this,"Fire TV Startseite nicht verfügbar",Toast.LENGTH_LONG).show();}
              }
              // Home routing only. No screen scraping, capture, or viewing-history requests.
              public static class ContinueService extends AccessibilityService{
                  static ContinueService running;
                  final Handler h=new Handler(Looper.getMainLooper());final Runnable launch=this::showPreview;
                  boolean registered,manualAmazon;long ignoreUntil,suppressUntil;
                  static final class HomeReceiver extends BroadcastReceiver{
                      final ContinueService service;HomeReceiver(ContinueService s){service=s;}
                      @Override public void onReceive(Context c,Intent i){long now=SystemClock.elapsedRealtime();if(now<service.ignoreUntil)return;service.manualAmazon=false;service.suppressUntil=0;service.h.removeCallbacks(service.launch);service.h.postDelayed(service.launch,450);}
                  }
                  final HomeReceiver receiver=new HomeReceiver(this);
                  @Override protected void onServiceConnected(){super.onServiceConnected();running=this;try{registerReceiver(receiver,new IntentFilter("com.amazon.tv.launcher.HOME_PRESSED"));registered=true;}catch(Exception ignored){}}
                  void pauseForAmazon(){manualAmazon=true;ignoreUntil=SystemClock.elapsedRealtime()+1800;h.removeCallbacks(launch);}
                  @Override public void onAccessibilityEvent(AccessibilityEvent e){
                      if(e.getPackageName()==null||!AMAZON.contentEquals(e.getPackageName())||e.getEventType()!=AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED||manualAmazon||SystemClock.elapsedRealtime()<suppressUntil)return;
                      String cls=String.valueOf(e.getClassName());if(!cls.contains("HomeActivity"))return;h.removeCallbacks(launch);h.postDelayed(launch,550);
                  }
                  void showPreview(){if(manualAmazon)return;suppressUntil=SystemClock.elapsedRealtime()+5000;try{startActivity(new Intent(this,PreviewActivity.class).putExtra("show_home",true).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK|Intent.FLAG_ACTIVITY_SINGLE_TOP));}catch(Exception ignored){}}
                  @Override public void onInterrupt(){h.removeCallbacks(launch);}
                  @Override public void onDestroy(){onInterrupt();if(registered)try{unregisterReceiver(receiver);}catch(Exception ignored){}if(running==this)running=null;super.onDestroy();}
              }
          }
          JAVA
          cat > AndroidManifest.xml <<'MANIFEST'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.fireframe.preview6" android:versionCode="6" android:versionName="0.6">
           <uses-sdk android:minSdkVersion="22" android:targetSdkVersion="28" />
           <uses-feature android:name="android.software.leanback" android:required="false" />
           <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
           <application android:label="FireFrame Preview 0.6" android:allowBackup="false" android:theme="@android:style/Theme.Black.NoTitleBar.Fullscreen">
            <activity android:name=".PreviewActivity" android:exported="true" android:launchMode="singleTask" android:screenOrientation="landscape">
             <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LEANBACK_LAUNCHER"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
            </activity>
            <service android:name=".PreviewActivity$ContinueService" android:exported="true" android:label="FireFrame Preview – Home-Taste" android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
             <intent-filter><action android:name="android.accessibilityservice.AccessibilityService"/></intent-filter>
             <meta-data android:name="android.accessibilityservice" android:resource="@xml/continue_service"/>
            </service>
           </application>
          </manifest>
          MANIFEST
          cat > res/xml/continue_service.xml <<'XML'
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android" android:packageNames="com.amazon.tv.launcher" android:accessibilityEventTypes="typeWindowStateChanged" android:accessibilityFeedbackType="feedbackGeneric" android:canRetrieveWindowContent="false" android:notificationTimeout="100"  />
          XML
          BT="$ANDROID_HOME/build-tools/35.0.0"
          JAR="$ANDROID_HOME/platforms/android-34/android.jar"
          "$BT/aapt2" compile --dir res -o res.zip
          "$BT/aapt2" link -o base.apk -I "$JAR" --manifest AndroidManifest.xml --min-sdk-version 22 --target-sdk-version 28 res.zip
          javac -encoding UTF-8 -source 1.8 -target 1.8 -bootclasspath "$JAR:$BT/core-lambda-stubs.jar" -d classes src/PreviewActivity.java
          "$BT/d8" --min-api 22 --release --lib "$JAR" --output dex $(find classes -name '*.class')
          cp base.apk unsigned.apk
          (cd dex && zip -q ../unsigned.apk classes.dex)
          "$BT/zipalign" -f 4 unsigned.apk aligned.apk
          keytool -genkeypair -keystore preview.jks -storepass preview-test -keypass preview-test -alias preview -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=FireFrame Preview Test"
          "$BT/apksigner" sign --ks preview.jks --ks-pass pass:preview-test --out FireFrame-Preview-06.apk aligned.apk
          "$BT/apksigner" verify FireFrame-Preview-06.apk
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: FireFrame-Preview-06
          path: preview-build/FireFrame-Preview-06.apk
          if-no-files-found: error
